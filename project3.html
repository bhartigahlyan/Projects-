
<html>
<head>
    <title>Tailwind Dynamic Box</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 p-8">

    <button id="add"
        class="bg-yellow-500 text-white px-5 py-2 rounded-lg mr-3 hover:bg-blue-700">
        Add Box
    </button>

    <button id="remove"
        class="bg-red-500 text-white px-5 py-2 rounded-lg hover:bg-red-700">
        Remove Box
    </button>

    <br><br>

    <input type="text"
        id="text"
        placeholder="Enter text"
        class="border border-black-400 p-2 rounded-lg w-64">


    <div id="container" class="mt-5"></div>

    <script>

        let addBtn = document.getElementById("add");
        let removeBtn = document.getElementById("remove");
        let container = document.getElementById("container");

        addBtn.onclick = () => {

            let value = document.getElementById("text").value;

            let div = document.createElement("div");

            div.className =
                "w-64 h-24 bg-cyan-200 mt-4 p-4 rounded-xl shadow-lg text-2xl";

            div.innerHTML = value || "Box";

            container.appendChild(div);
        };

        removeBtn.onclick = () => {

            if (container.lastChild) {
                container.removeChild(container.lastChild);
            }
        };

    </script>

</body>
</html>

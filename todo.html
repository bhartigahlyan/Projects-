<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-to-br from-purple-200 to-indigo-300 min-h-screen p-6">

<div class="max-w-3xl mx-auto">

  
  <div class="text-center mb-6">
    <h1 class="text-4xl font-bold text-white">My Tasks</h1>
  </div>
  
  <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
    <input id="taskTitle" type="text" placeholder="Task Title" 
      class="w-full border-2 border-gray-200 rounded-lg p-3 mb-3 focus:border-purple-500 outline-none">
    
    <textarea id="taskDesc" placeholder="Task Description" 
      class="w-full border-2 border-gray-200 rounded-lg p-3 mb-3 h-24 focus:border-purple-500 outline-none"></textarea>
    
    <button id="saveTask" 
      class="w-full bg-purple-400 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
      + Add New Task
    </button>
  </div>

  
  <div class="bg-white rounded-2xl shadow-2xl p-4 mb-6 flex gap-3">
    <input id="searchTask" type="text" placeholder="Search your tasks..." 
      class="flex-1 border-2 border-gray-200 rounded-lg p-3 focus:border-purple-500 outline-none">
    <button id="searchBtn" 
      class="bg-indigo-600 hover:bg-indigo-400 text-white px-6 rounded-lg font-semibold">
      Search
    </button>
  </div>

  
  <div id="taskContainer" class="space-y-4">
    
  </div>

</div>

<script>

let allTasks = JSON.parse(localStorage.getItem("myTasks")) || [];


const titleInput = document.getElementById("taskTitle");
const descInput = document.getElementById("taskDesc");
const saveBtn = document.getElementById("saveTask");
const searchInput = document.getElementById("searchTask");
const searchBtn = document.getElementById("searchBtn");
const container = document.getElementById("taskContainer");


const saveData = () => localStorage.setItem("myTasks", JSON.stringify(allTasks));


const createTask = () => {
  if(titleInput.value.trim() === "" || descInput.value.trim() === ""){
    Swal.fire("Error!", "Title and Description required", "error");
    return;
  }

  const newTask = {
    id: Date.now(),
    title: titleInput.value,
    desc: descInput.value,
    done: false
  };

  allTasks.unshift(newTask);
  saveData();
  titleInput.value = "";
  descInput.value = "";
  renderTasks(allTasks);
  Swal.fire("Success!", "Task Added", "success");
}


const renderTasks = (taskArray) => {
  container.innerHTML = "";
  
  if(taskArray.length === 0){
    container.innerHTML = `<div class="bg-white rounded-2xl shadow p-6 text-center text-gray-500">No Tasks Found</div>`;
    return;
  }

  taskArray.forEach(task => {
    const card = document.createElement("div");
    card.className = `bg-white rounded-2xl shadow-lg p-5 border-l-4 ${task.done ? 'border-green-500 opacity-70' : 'border-purple-500'}`;
    
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div class="flex-1" id="view-${task.id}">
          <h3 class="text-xl font-bold ${task.done ? 'line-through' : ''}">${task.title}</h3>
          <p class="text-gray-600 mt-1 ${task.done ? 'line-through' : ''}">${task.desc}</p>
        </div>
      </div>
      <div class="flex gap-2 mt-4" id="btns-${task.id}">
        <button onclick="toggleDone(${task.id})" 
          class="${task.done ? 'bg-yellow-500' : 'bg-green-500'} text-white px-4 py-2 rounded-lg">
          ${task.done ? 'Undo' : 'Done'}
        </button>
        <button onclick="editTask(${task.id})" 
          class="bg-blue-500 text-white px-4 py-2 rounded-lg">
          Edit
        </button>
        <button onclick="removeTask(${task.id})" 
          class="bg-red-500 text-white px-4 py-2 rounded-lg">
          Remove
        </button>
      </div>
    `;
    container.appendChild(card);
  });
}


const toggleDone = (id) => {
  allTasks = allTasks.map(t => t.id === id ? {...t, done: !t.done} : t);
  saveData();
  renderTasks(allTasks);
}


const editTask = (id) => {
  const task = allTasks.find(t => t.id === id);
  const viewDiv = document.getElementById(`view-${id}`);
  const btnDiv = document.getElementById(`btns-${id}`);

  viewDiv.innerHTML = `
    <input id="editTitle-${id}" value="${task.title}" class="w-full border p-2 rounded mb-2">
    <textarea id="editDesc-${id}" class="w-full border p-2 rounded h-20">${task.desc}</textarea>
  `;

  btnDiv.innerHTML = `
    <button onclick="saveEdit(${id})" class="bg-green-500 text-white px-4 py-2 rounded-lg">Save</button>
    <button onclick="renderTasks(allTasks)" class="bg-gray-500 text-white px-4 py-2 rounded-lg">Cancel</button>
  `;
}


const saveEdit = (id) => {
  const newTitle = document.getElementById(`editTitle-${id}`).value;
  const newDesc = document.getElementById(`editDesc-${id}`).value;
  
  allTasks = allTasks.map(t => t.id === id ? {...t, title: newTitle, desc: newDesc} : t);
  saveData();
  renderTasks(allTasks);
  Swal.fire("Updated!", "Task Updated", "success");
}


const removeTask = (id) => {
  Swal.fire({
    title: "Delete this task?",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#D0021B"
  }).then((res) => {
    if(res.isConfirmed){
      allTasks = allTasks.filter(t => t.id !== id);
      saveData();
      renderTasks(allTasks);
    }
  });
}


const doSearch = () => {
  const keyword = searchInput.value.toLowerCase();
  const filtered = allTasks.filter(t => 
    t.title.toLowerCase().includes(keyword) || 
    t.desc.toLowerCase().includes(keyword)
  );
  renderTasks(filtered);
}


saveBtn.addEventListener("click", createTask);
searchBtn.addEventListener("click", doSearch);
searchInput.addEventListener("keyup", doSearch);


renderTasks(allTasks);
</script>
</body>
</html>
